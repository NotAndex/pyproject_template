[tox]
minversion = 3.12.0
envlist = py312,py313,py314
isolated_build = true

[gh]
python =
    3.12 = py312
    3.13 = py313
    3.14 = py314

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
#deps = -r{toxinidir}/requirements_dev.txt
deps = 
    pytest
commands =
    pytest --basetemp={envtmpdir}
